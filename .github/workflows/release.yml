# A pushed tag v<version> (made by `npm run changelog -- release`, see
# changelog/README.md) becomes a GitHub release with the entries of that version.
# The browser version itself is published by pages.yml on every push to main.
name: GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Release notes from changelog/releases
        run: node ui/scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Klangwelt ${GITHUB_REF_NAME#v}" --notes-file notes.md
