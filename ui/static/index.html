<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0d0f14" />
    <title>Klangwelt</title>
    <!-- installable as an app (Android, desktop browsers); icons: scripts/icons.mjs -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Klangwelt" />
    <!-- installed on iOS (no full screen there): the page reaches under the status bar,
         the safe-area padding of #app keeps it clear -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- interface size and spacing of this device, before anything is laid out (boot.ts) -->
    <script src="boot.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="app">
      <kw-transport></kw-transport>
      <div id="dock"></div>
      <kw-toast></kw-toast>
    </div>
  </body>
</html>
